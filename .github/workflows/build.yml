# Install Python dependencies, run tests and lint with different versions of Python and
# the required dependencies.

name: Build Pipeline

on:
  push:
#    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

env:
  UV_ACTION_VERSION: "8.1.0"

jobs:
  version-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@v$UV_ACTION_VERSION
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Test with pytest
        run: |
          pytest -v -m "not regression"
