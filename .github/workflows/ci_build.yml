name: "Build Pipeline"

on:
  push:
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

env:
  UV_VERSION: "0.11.7"
  RUFF_VERSION: "0.14.2"
  PYRIGHT_VERSION: "1.1.409"
  LATEST_PYTHON_VERSION: "3.14"

jobs:
  sca:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: ${{ env.LATEST_PYTHON_VERSION }}
          version: ${{ env.UV_VERSION }}

      - name: Install dependencies
        run: uv sync --extra dev --extra demo

      - name: Run ruff
        uses: astral-sh/ruff-action@v4.0.0
        with:
          version: ${{ env.RUFF_VERSION }}

      - name: Run pyright
        uses: jakebailey/pyright-action@v3
        with:
          version: ${{ env.PYRIGHT_VERSION }}

  test-version-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: ${{ matrix.python-version }}
          version: ${{ env.UV_VERSION }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run unit tests
        # Run the tests with coverage only with the latest Python version, to avoid
        # unnecessary multiple coverage runs.
        run: |
          if [ "${{ matrix.python-version }}" = "${{ env.LATEST_PYTHON_VERSION }}" ]; then
            uv run pytest -v -m "not regression" --cov=rt_opt --cov-report=json --junitxml unit-test-results/test_report.xml
          else
            uv run pytest -v -m "not regression" --junitxml unit-test-results/test_report.xml
          fi

      - name: Publish unit test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: (!cancelled())
        with:
          files: unit-test-results/**/*.xml
          check_name: Unit Test Results (Python ${{ matrix.python-version }})

      - name: Run regression tests
        # Run regression tests only for the latest Python version.
        if: ${{ matrix.python-version == env.LATEST_PYTHON_VERSION }}
        run: |
          uv run pytest -v -m regression --junitxml regression-test-results/test_report.xml

      - name: Publish regression test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: ${{ matrix.python-version == env.LATEST_PYTHON_VERSION && !cancelled() }}
        with:
          files: regression-test-results/**/*.xml
          check_name: Regression Test Results (Python ${{ env.LATEST_PYTHON_VERSION }})

      - name: Update Coverage Badge
        # Only update the coverage badge for the latest Python version and on the
        # default branch.
        if: ${{ matrix.python-version == env.LATEST_PYTHON_VERSION && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        uses: we-cli/coverage-badge-action@main